name: Build instalador Windows (Inmobiliaria App)

on:
  workflow_dispatch:
  push:
    paths:
      - "inmobiliaria-app/**"
      - ".github/workflows/build-inmobiliaria-windows.yml"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: inmobiliaria-app
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias del frontend
        run: npm install

      - name: Compilar instalador (.exe / .msi)
        env:
          INMOBILIARIA_SUPABASE_URL: ${{ secrets.INMOBILIARIA_SUPABASE_URL }}
          INMOBILIARIA_SUPABASE_ANON_KEY: ${{ secrets.INMOBILIARIA_SUPABASE_ANON_KEY }}
        run: npm run tauri build

      - name: Subir instalador como artifact descargable
        uses: actions/upload-artifact@v4
        with:
          name: inmobiliaria-app-windows-installer
          path: |
            inmobiliaria-app/src-tauri/target/release/bundle/nsis/*.exe
            inmobiliaria-app/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
